<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Black Book Player</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #0A0A0A;
  color: #E8E8E8;
  font-family: 'Cormorant Garamond', Georgia, serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* Header */
header {
  background: rgba(10,10,10,0.98);
  border-bottom: 1px solid rgba(160,160,160,0.12);
  padding: 18px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}
header h1 {
  font-family: 'Cinzel', serif;
  font-size: 19px;
  letter-spacing: 5px;
  color: #C8A070;
  text-transform: uppercase;
}

/* Main Player */
.player-container {
  max-width: 480px;
  margin: 0 auto;
  padding: 20px;
}

/* Phrase Card */
.phrase-card {
  background: rgba(255,255,255,0.035);
  border: 1px solid rgba(160,160,160,0.18);
  border-radius: 16px;
  padding: 36px 28px;
  margin-bottom: 32px;
  text-align: center;
  box-shadow: 0 12px 40px rgba(0,0,0,0.7);
}
.phrase-russian {
  font-size: 32px;
  line-height: 1.3;
  margin-bottom: 14px;
  font-weight: 300;
}
.phrase-english {
  font-size: 19px;
  color: #C8A070;
  margin-bottom: 8px;
}
.phrase-romanization {
  font-size: 16px;
  color: rgba(255,255,255,0.55);
  font-style: italic;
}

/* Voice Selector */
.voice-selector {
  display: flex;
  background: rgba(255,255,255,0.06);
  border-radius: 30px;
  padding: 5px;
  margin: 24px 0 36px;
}
.voice-btn {
  flex: 1;
  padding: 14px;
  border-radius: 26px;
  text-align: center;
  font-size: 15px;
  transition: all 0.3s;
}
.voice-btn.active {
  background: #8B1A1A;
  color: white;
  box-shadow: 0 4px 15px rgba(139,26,26,0.5);
}

/* Controls */
.controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 36px;
  margin: 40px 0;
}
.btn-control {
  background: none;
  border: none;
  color: #E8E8E8;
  font-size: 38px;
  cursor: pointer;
}
.play-btn {
  width: 82px;
  height: 82px;
  background: #8B1A1A;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 42px;
  box-shadow: 0 10px 30px rgba(139,26,26,0.6);
}

/* Progress */
.progress-container {
  margin: 20px 0 40px;
}
.progress {
  height: 4px;
  background: rgba(255,255,255,0.1);
  border-radius: 2px;
  position: relative;
}
.progress-bar {
  height: 100%;
  width: 48%;
  background: linear-gradient(to right, #C8A070, #E8C090);
  border-radius: 2px;
}

/* Queue */
.queue {
  margin-top: 20px;
}
.queue h3 {
  font-size: 13px;
  letter-spacing: 2.5px;
  color: rgba(255,255,255,0.45);
  margin-bottom: 14px;
}
.queue-item {
  padding: 16px 20px;
  background: rgba(255,255,255,0.03);
  border-radius: 12px;
  margin-bottom: 10px;
  cursor: pointer;
  transition: all 0.2s;
}
.queue-item.active {
  background: rgba(139,26,26,0.25);
  border-left: 4px solid #C8A070;
}
</style>
</head>
<body>
<header>
  <h1>BLACK BOOK</h1>
</header>

<div class="player-container">
  <div class="phrase-card">
    <div class="phrase-russian" id="russian">Ты красивая.</div>
    <div class="phrase-english" id="english">You're beautiful.</div>
    <div class="phrase-romanization" id="romanization">Ty krasivaya.</div>
  </div>

  <div class="voice-selector">
    <div class="voice-btn active" id="nativeBtn">Native • Clark</div>
    <div class="voice-btn" id="foreignBtn">Foreign • Natasha</div>
  </div>

  <div class="progress-container">
    <div class="progress">
      <div class="progress-bar"></div>
    </div>
  </div>

  <div class="controls">
    <button class="btn-control">⫻</button>
    <button class="btn-control play-btn" id="playBtn">▶</button>
    <button class="btn-control">⫻</button>
  </div>

  <div class="queue">
    <h3>CHAPTER QUEUE</h3>
    <!-- Populated by JS -->
  </div>
</div>

<script>
// Basic interactivity - expand as needed
document.getElementById('playBtn').addEventListener('click', function() {
  this.textContent = this.textContent === '▶' ? '❚❚' : '▶';
});
</script>
</body>
</html>
